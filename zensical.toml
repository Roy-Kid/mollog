[project]
site_name = "mollog"
site_description = "Zero-dependency structured logging for Python services, scripts, and background workers."
site_url = "https://molcrafts.github.io/mollog/"
site_author = "Roy Kid"
copyright = "Copyright &copy; 2026 MolCrafts"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/MolCrafts/mollog"
repo_name = "MolCrafts/mollog"

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Getting Started" = "getting-started.md" },
    { "Configuration" = "configuration.md" },
    { "Context Propagation" = "context.md" },
    { "Behavior" = "behavior.md" },
    { "Rich Console" = "rich.md" },
    { "Logfire" = "logfire.md" },
  ] },
  { "API Reference" = "api.md" },
  { "Changelog" = "release-notes.md" },
]

# Shared MolCrafts theme (github.com/MolCrafts/molcrafts-zensical-theme): brand
# palette, light/dark schemes, navigation features, and the home-page
# hero/manual-home layout that docs/index.md uses. The theme already supplies
# the features/palette/fonts — do not re-list them here. Install the theme to
# build (see the `docs` optional-dependency group in pyproject.toml).
[project.theme]
name = "molcrafts"
language = "en"

# mollog accent (sky) for links, hovers, and hero eyebrows.
[project.extra.molcrafts]
product = "mollog"
accent = "#0ea5e9"                        # primary (主) — mollog signature colour
accent_soft = "rgba(14, 165, 233, 0.14)"  # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/mollog"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/molcrafts-mollog/"
