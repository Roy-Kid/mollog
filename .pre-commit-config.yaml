# Mirrors every check in .github/workflows/*.yml. Any divergence is a bug —
# when you add/modify a CI step, update this file in the same commit.
#
# CI (.github/workflows/ci.yml) runs, after `uv sync --frozen --extra dev`:
#   - lint: `uv run ruff check .`
#   - test: `uv run pytest -q`   (Python 3.12 / 3.13 / 3.14)
# Local hooks below invoke the IDENTICAL `uv run ...` commands so the tool
# versions are governed by uv.lock, exactly as in CI.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      # CI: lint job -> `uv run ruff check .`
      - id: ruff-check
        name: ruff check (uv run, mirrors CI lint job)
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      # CI: test job -> `uv run pytest -q` (run at pre-push, like CI on push/PR)
      - id: pytest
        name: pytest (uv run, mirrors CI test job)
        entry: uv run pytest -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
